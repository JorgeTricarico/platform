<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#f0f4ff" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Left hand -->
  <g>
    <!-- Palm -->
    <ellipse cx="70" cy="100" rx="18" ry="25" fill="#d4a574" transform="rotate(-20 70 100)"/>
    <!-- Fingers -->
    <ellipse cx="55" cy="75" rx="6" ry="12" fill="#d4a574" transform="rotate(-35 55 75)"/>
    <ellipse cx="60" cy="70" rx="6" ry="12" fill="#d4a574" transform="rotate(-25 60 70)"/>
    <ellipse cx="65" cy="68" rx="6" ry="12" fill="#d4a574" transform="rotate(-15 65 68)"/>
  </g>
  
  <!-- Right hand -->
  <g>
    <!-- Palm -->
    <ellipse cx="130" cy="100" rx="18" ry="25" fill="#d4a574" transform="rotate(20 130 100)"/>
    <!-- Fingers -->
    <ellipse cx="145" cy="75" rx="6" ry="12" fill="#d4a574" transform="rotate(35 145 75)"/>
    <ellipse cx="140" cy="70" rx="6" ry="12" fill="#d4a574" transform="rotate(25 140 70)"/>
    <ellipse cx="135" cy="68" rx="6" ry="12" fill="#d4a574" transform="rotate(15 135 68)"/>
  </g>
  
  <!-- Center wave/energy lines -->
  <path d="M 85 110 Q 95 105 105 110" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 80 125 Q 100 115 120 125" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7c3aed">
    MASAJES
  </text>
</svg>