##############################################################################
# .github/workflows/deploy.yml  (symlink or copy to .github/workflows/)
#
# CI/CD pipeline: lint → test → build Docker images → push to GHCR → deploy
#
# Triggers:
#   push to main         → deploy all tenants listed in TENANT_MATRIX
#   workflow_dispatch    → manual deploy for a specific tenant + env
#
# Required GitHub Secrets:
#   GHCR_TOKEN           — PAT with write:packages
#   COOLIFY_URL          — https://coolify.yourplatform.com
#   COOLIFY_API_TOKEN    — generated in Coolify → Profile → API tokens
#   COOLIFY_UUID_<SLUG>  — per-tenant Coolify service UUID (e.g. COOLIFY_UUID_ZENKO)
##############################################################################

name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "clients/**"
      - "platform-v2/infra/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant slug to deploy (leave empty for all)"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options: [staging, prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (backend)
        run: cd backend && npx tsc --noEmit

      - name: Type check (clients)
        run: |
          for dir in clients/*/; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Type checking $dir..."
              cd "$dir" && npx tsc --noEmit && cd ../..
            fi
          done

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:testpassword@localhost:5432/platform_test
      JWT_SECRET: test-jwt-secret-for-ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations (test DB)
        run: cd backend && npx prisma migrate deploy

      - name: Run all tests
        run: npx vitest run --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/coverage/
            clients/*/coverage/
          retention-days: 7

  # ── Job 3: Build Docker images ───────────────────────────────────────────────
  build:
    name: Build ${{ matrix.tenant }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        tenant:
          - zenko
          - mg-masajes
          # Add more tenants here as the platform grows
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Load tenant env
        id: tenant-env
        run: |
          SLUG="${{ matrix.tenant }}"
          ENV_FILE="platform-v2/infra/tenants/$SLUG/.env"

          # Defaults (CI overrides production secrets via GitHub Secrets)
          VITE_API_URL="https://api.${SLUG}.yourplatform.com"
          VITE_TENANT="$SLUG"
          TENANT_PATH="clients/$SLUG"

          if [ -f "$ENV_FILE" ]; then
            VITE_API_URL=$(grep VITE_API_URL "$ENV_FILE" | cut -d= -f2- || echo "$VITE_API_URL")
            TENANT_PATH=$(grep TENANT_PATH "$ENV_FILE" | cut -d= -f2- || echo "$TENANT_PATH")
          fi

          echo "vite_tenant=$VITE_TENANT"   >> "$GITHUB_OUTPUT"
          echo "vite_api_url=$VITE_API_URL" >> "$GITHUB_OUTPUT"
          echo "tenant_path=$TENANT_PATH"   >> "$GITHUB_OUTPUT"

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/platform-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/platform-web-${{ matrix.tenant }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform-v2/infra/docker/Dockerfile.backend
          target: runner
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform-v2/infra/docker/Dockerfile.web
          target: runner
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web-${{ matrix.tenant }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.tenant }}
          platforms: linux/amd64
          build-args: |
            VITE_TENANT=${{ steps.tenant-env.outputs.vite_tenant }}
            VITE_API_URL=${{ steps.tenant-env.outputs.vite_api_url }}
            TENANT_PATH=${{ steps.tenant-env.outputs.tenant_path }}

  # ── Job 4: Deploy via Coolify ────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.tenant }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1    # Deploy tenants sequentially to avoid overloading VPS
      matrix:
        tenant:
          - zenko
          - mg-masajes
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}
      url: https://${{ matrix.tenant }}.yourplatform.com
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # Per-tenant secret: COOLIFY_UUID_ZENKO, COOLIFY_UUID_MG_MASAJES, etc.
          COOLIFY_APP_UUID: ${{ secrets[format('COOLIFY_UUID_{0}', upper(matrix.tenant))] }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::warning::COOLIFY_UUID_$(echo ${{ matrix.tenant }} | tr '[:lower:]-' '[:upper:]_') secret not set — skipping deploy for ${{ matrix.tenant }}"
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /tmp/coolify_response.json -w "%{http_code}" \
            -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"$COOLIFY_APP_UUID\", \"tag\": \"$IMAGE_TAG\"}")

          echo "Coolify response (HTTP $HTTP_STATUS):"
          cat /tmp/coolify_response.json

          if [[ "$HTTP_STATUS" != "200" && "$HTTP_STATUS" != "201" ]]; then
            echo "::error::Coolify deployment failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Deployment triggered successfully for ${{ matrix.tenant }}"

      - name: Wait for health check
        env:
          TENANT: ${{ matrix.tenant }}
        run: |
          URL="https://api.${TENANT}.yourplatform.com/health"
          echo "Waiting for $URL to become healthy..."
          for i in $(seq 1 24); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [[ "$HTTP" == "200" ]]; then
              echo "Health check passed after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/24 — HTTP $HTTP — waiting 5s..."
            sleep 5
          done
          echo "::warning::Health check did not pass within 120s — check Coolify dashboard"
