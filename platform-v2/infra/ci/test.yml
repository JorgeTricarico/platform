##############################################################################
# .github/workflows/test.yml  (symlink or copy to .github/workflows/)
#
# Runs full test suite on every push and PR.
# Uses Turborepo for parallel execution and caching.
#
# Jobs:
#   type-check   — TypeScript compilation check for all packages
#   unit-tests   — Vitest unit tests (backend + all clients)
#   integration  — Backend integration tests against real PostgreSQL
##############################################################################

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM:  ${{ secrets.TURBO_TEAM }}

jobs:
  # ── Job 1: TypeScript type check ─────────────────────────────────────────────
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check all packages
        run: |
          echo "=== Backend ==="
          cd backend && npx tsc --noEmit && cd ..

          echo "=== Clients ==="
          for dir in clients/*/; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Checking $dir..."
              (cd "$dir" && npx tsc --noEmit)
            fi
          done

  # ── Job 2: Unit tests ────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        env:
          # Use mocked Prisma — no real DB needed for unit tests
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          JWT_SECRET: "test-secret-32-chars-minimum-here"
          NODE_ENV: test
        run: npx vitest run --reporter=verbose --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
          retention-days: 3

  # ── Job 3: Integration tests (real DB) ───────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: platform_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://platform:testpassword@localhost:5432/platform_integration
      JWT_SECRET: integration-test-jwt-secret-minimum-32-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed test data
        working-directory: backend
        run: |
          if [ -f "prisma/seed.ts" ]; then
            npx ts-node prisma/seed.ts
          fi

      - name: Run integration tests
        run: |
          npx vitest run \
            --config backend/vitest.integration.config.ts \
            --reporter=verbose \
        continue-on-error: false

      - name: Upload integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/coverage/
          retention-days: 3

  # ── Job 4: Build smoke test ───────────────────────────────────────────────────
  build-smoke:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build clients
        run: |
          for dir in clients/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Building $dir..."
              (cd "$dir" && npm run build)
            fi
          done
        env:
          VITE_TENANT: zenko
          VITE_API_URL: https://api.example.com

  # ── Summary ───────────────────────────────────────────────────────────────────
  test-summary:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [type-check, unit-tests, integration-tests, build-smoke]
    if: always()
    steps:
      - name: Check results
        run: |
          RESULTS=(
            "${{ needs.type-check.result }}"
            "${{ needs.unit-tests.result }}"
            "${{ needs.integration-tests.result }}"
            "${{ needs.build-smoke.result }}"
          )
          FAILED=0
          for r in "${RESULTS[@]}"; do
            if [[ "$r" == "failure" ]]; then
              FAILED=$((FAILED+1))
            fi
          done
          if [[ $FAILED -gt 0 ]]; then
            echo "$FAILED job(s) failed"
            exit 1
          fi
          echo "All checks passed!"
